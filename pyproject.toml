[project]
name = "nova"
version = "0.1.0"
description = "NOVA - Networked Operations & Voice Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.9.0",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "markdown>=3.11",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "send2trash>=2.1.0",
    "uvicorn[standard]>=0.54.0",
    "xhtml2pdf>=0.2.21",
]

[project.scripts]
nova = "nova.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
