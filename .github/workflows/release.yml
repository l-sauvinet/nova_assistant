# Builds the Windows installer on GitHub's machines and prepares a draft release with it.
#
# To publish a version: set the same version in desktop/src-tauri/tauri.conf.json, desktop/package.json and
# desktop/src-tauri/Cargo.toml, commit, then push a matching tag (git tag v0.1.0 && git push origin v0.1.0).
# The release stays a draft until it is published by hand on GitHub.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the engine's Python dependencies
        run: uv sync --locked

      - name: Install the app's dependencies
        working-directory: desktop
        run: npm ci

      - name: Test the app
        working-directory: desktop
        run: npm test

      - name: Build the engine and the installer
        working-directory: desktop
        run: npm run app:build

      - name: Compute the installer's SHA-256
        id: installer
        run: |
          installer=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          name=$(basename "$installer")
          sha=$(sha256sum "$installer" | cut -d' ' -f1)
          echo "$sha  $name" > "$installer.sha256"
          # Same file under a name that never changes: the website's download button points at
          # releases/latest/download/NOVA-setup.exe, which always serves the newest version.
          cp "$installer" "$(dirname "$installer")/NOVA-setup.exe"
          echo "path=$installer" >> "$GITHUB_OUTPUT"
          echo "stable=$(dirname "$installer")/NOVA-setup.exe" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: nova-installer
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.path }}.sha256

      - name: Prepare the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: NOVA ${{ github.ref_name }}
          files: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.path }}.sha256
            ${{ steps.installer.outputs.stable }}
          body: |
            ## Installer NOVA sur Windows 10 / 11 (64 bits)

            1. Téléchargez **${{ steps.installer.outputs.name }}** ci-dessous et lancez-le.
            2. L'installeur n'est pas encore signé : Windows affiche « Windows a protégé votre ordinateur ».
               Cliquez sur **Informations complémentaires**, puis **Exécuter quand même**.
            3. NOVA utilise **Claude Code** : installez-le et connectez-vous avec un abonnement Claude
               **Pro ou Max** (un compte gratuit ne suffit pas). L'écran de compte de NOVA vous guide.

            **Vérifier le fichier** (SHA-256) : `${{ steps.installer.outputs.sha }}`

            Dans PowerShell : `(Get-FileHash .\${{ steps.installer.outputs.name }}).Hash`
